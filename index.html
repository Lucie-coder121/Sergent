<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#20271d">
  <title>Le Rapport — Banque d'expressions militaires</title>
  <style>
    :root {
      --night: #151914;
      --guard: #20271d;
      --olive: #4e5b3d;
      --khaki: #a59d72;
      --sand: #d8d0ae;
      --paper: #eee9d5;
      --ink: #24281f;
      --rust: #a65037;
      --line: rgba(216, 208, 174, .23);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--paper);
      background:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px),
        radial-gradient(circle at 15% 15%, #34402d 0, transparent 32rem),
        var(--night);
      background-size: 32px 32px, 32px 32px, auto, auto;
      font-family: "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
      letter-spacing: .025em;
    }

    .page {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 52px 0 44px;
    }

    header {
      display: grid;
      grid-template-columns: 82px 1fr;
      gap: 22px;
      align-items: center;
      margin-bottom: 30px;
    }

    .insignia {
      width: 82px;
      height: 82px;
      display: grid;
      place-items: center;
      border: 2px solid var(--khaki);
      transform: rotate(45deg);
      background: var(--guard);
      box-shadow: 0 0 0 5px var(--night), 0 0 0 6px var(--olive);
    }

    .insignia span {
      transform: rotate(-45deg);
      color: var(--sand);
      font: 700 28px Georgia, serif;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--khaki);
      font-size: .74rem;
      font-weight: 800;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.3rem, 8vw, 4.7rem);
      line-height: .9;
      letter-spacing: .035em;
      text-transform: uppercase;
      text-shadow: 3px 3px 0 #0b0d0a;
    }

    .subtitle {
      margin: 13px 0 0;
      color: var(--sand);
      font: italic 1rem Georgia, serif;
    }

    main {
      overflow: hidden;
      border: 1px solid var(--line);
      border-top: 5px solid var(--khaki);
      background: rgba(32, 39, 29, .94);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .4);
    }

    .input-panel { padding: 30px; }

    label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .step {
      display: inline-grid;
      width: 27px;
      height: 27px;
      place-items: center;
      color: var(--night);
      background: var(--khaki);
      border-radius: 50%;
    }

    textarea {
      width: 100%;
      min-height: 132px;
      resize: vertical;
      padding: 17px 18px;
      border: 1px solid #7c795e;
      border-left: 4px solid var(--khaki);
      outline: none;
      color: var(--ink);
      background: var(--paper);
      font: 1rem/1.55 Georgia, serif;
      box-shadow: inset 0 0 20px rgba(40, 44, 31, .09);
    }

    textarea:focus { box-shadow: 0 0 0 3px rgba(165, 157, 114, .25); }
    textarea::placeholder { color: #72735f; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      min-height: 48px;
      padding: 0 24px;
      border: 0;
      cursor: pointer;
      font: 800 .84rem "Arial Narrow", Arial, sans-serif;
      letter-spacing: .15em;
      text-transform: uppercase;
      transition: transform .15s ease, filter .15s ease, background .15s ease;
    }

    button:hover { transform: translateY(-2px); filter: brightness(1.12); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }

    .primary { color: #fff; background: var(--rust); }
    .primary::after { content: "  ›"; font-size: 1.15rem; }
    .secondary { color: var(--paper); border: 1px solid var(--khaki); background: transparent; }

    .results {
      padding: 30px;
      border-top: 1px dashed var(--line);
      background: rgba(13, 16, 12, .35);
    }

    .results[hidden] { display: none; }

    .results-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 18px;
      margin-bottom: 17px;
    }

    h2 { margin: 0; font-size: 1rem; letter-spacing: .16em; text-transform: uppercase; }
    .counter { color: var(--khaki); font: italic .8rem Georgia, serif; }

    .cards { display: grid; gap: 12px; }

    .card {
      display: grid;
      grid-template-columns: 50px 1fr;
      align-items: center;
      min-height: 78px;
      border: 1px solid var(--line);
      border-right: 4px solid var(--olive);
      background: var(--paper);
      color: var(--ink);
      animation: report-in .35s both;
    }

    .card:nth-child(2) { animation-delay: .07s; }
    .card:nth-child(3) { animation-delay: .14s; }

    .number {
      align-self: stretch;
      display: grid;
      place-items: center;
      color: var(--sand);
      background: var(--olive);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .quote { margin: 0; padding: 18px 21px; font: 700 clamp(1rem, 3vw, 1.2rem)/1.35 Georgia, serif; }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 18px;
      color: #8e927e;
      font-size: .68rem;
      font-weight: bold;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    @keyframes report-in {
      from { opacity: 0; transform: translateX(-12px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @media (max-width: 560px) {
      .page { width: min(100% - 20px, 920px); padding-top: 30px; }
      header { grid-template-columns: 58px 1fr; gap: 17px; }
      .insignia { width: 58px; height: 58px; }
      .insignia span { font-size: 21px; }
      .input-panel, .results { padding: 21px 18px; }
      .actions button { width: 100%; }
      .results-heading, footer { align-items: flex-start; flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="insignia" aria-hidden="true"><span>LR</span></div>
      <div>
        <p class="eyebrow">Bureau des réparties · 24e compagnie</p>
        <h1>Le Rapport</h1>
        <p class="subtitle">À chaque situation, sa réponse réglementaire.</p>
      </div>
    </header>

    <main>
      <section class="input-panel" aria-labelledby="message-label">
        <label id="message-label" for="message"><span class="step">1</span> Message reçu / situation</label>
        <textarea id="message" placeholder="Collez ici le message reçu ou décrivez la situation…" spellcheck="true"></textarea>
        <div class="actions">
          <button class="primary" id="generate" type="button">Générer la riposte</button>
          <button class="secondary" id="restart" type="button">Recommencer</button>
        </div>
      </section>

      <section class="results" id="results" aria-labelledby="results-title" aria-live="polite" hidden>
        <div class="results-heading">
          <h2 id="results-title"><span class="step">2</span> Réponses autorisées</h2>
          <span class="counter">3 extraits du manuel</span>
        </div>
        <div class="cards" id="cards"></div>
        <div class="actions">
          <button class="secondary" id="more" type="button">Autres propositions</button>
        </div>
      </section>
    </main>

    <footer><span>Diffusion restreinte</span><span>Banque réglementaire · 100 expressions</span></footer>
  </div>

  <script>
    const expressions = [
      "Percute avant que je te percute.",
      "On n'est pas là pour encoller des taupes.",
      "Les brouettes, je ne leur parle pas, je les pousse.",
      "Domine la douleur.",
      "Verrouille ton cerveau.",
      "Garde à vous !",
      "En avant, calme et droit.",
      "On se sort les doigts du paquetage.",
      "Quand les jambes lâchent, la tête prend le relais.",
      "La sueur épargne le sang.",
      "Pas vu, pas pris ; pris, puni.",
      "Un ordre n'attend pas le printemps.",
      "Bouge avec le terrain, pas contre lui.",
      "Tu réfléchiras quand tu auras fini.",
      "Le doute reste au vestiaire.",
      "Mission d'abord, confort ensuite.",
      "On ne subit pas : on s'adapte.",
      "Plus vite que ça, c'est hier.",
      "Le plan est simple : on avance.",
      "C'est rustique, mais c'est tactique.",
      "Fais du bruit avec les résultats, pas avec la bouche.",
      "La carte est fausse, mais le terrain a raison.",
      "Tiens la ligne et garde le sourire.",
      "Pas de panique, on a connu pire avant le café.",
      "On n'abandonne rien, sauf les mauvaises excuses.",
      "La fatigue est une information, pas un ordre.",
      "Une place pour chaque chose, chaque chose dans le paquetage.",
      "Tu veux une médaille ou tu veux finir ?",
      "Le chef a toujours raison, surtout quand il pleut.",
      "Improvise, adapte-toi, exécute.",
      "On fera les comptes au retour.",
      "Rase les murs, pas les horaires.",
      "Le café est une munition collective.",
      "Si ça bouge, tu salues ; si ça ne bouge pas, tu nettoies.",
      "La ponctualité, c'est déjà cinq minutes de retard.",
      "Cherche pas à comprendre, cherche à rejoindre.",
      "Un volontaire ? Toi, là-bas.",
      "Le paquetage est lourd, l'honneur est léger.",
      "À genoux les hommes, debout les sacs.",
      "Ce qui ne tue pas remplit le compte rendu.",
      "Marche à l'ombre et bois de l'eau.",
      "Même direction, même foulée.",
      "On est une équipe, pas une collection de touristes.",
      "Le terrain commande, nous répondons.",
      "Pas de problème, que des solutions mal rangées.",
      "Ton meilleur outil est entre tes oreilles.",
      "Mets du cœur dans les jambes.",
      "Silence radio, efficacité maximum.",
      "Trois secondes pour décider, une vie pour assumer.",
      "Fais simple, solide et immédiat.",
      "Rien ne sert de râler, il faut partir à point.",
      "La météo est mauvaise pour tout le monde.",
      "Le règlement ne connaît pas la sieste.",
      "Garde ton azimut et ton humour.",
      "Un pas après l'autre, mais tous dans le même sens.",
      "Ça pique ? C'est que ça travaille.",
      "Mords dans la mission.",
      "Baisse la tête, monte le niveau.",
      "La chance sourit aux paquetages prêts.",
      "Le repos se mérite, le retard s'explique.",
      "Ordre reçu, ordre compris, ordre exécuté.",
      "Tu n'es pas perdu, tu reconnais le terrain.",
      "Le GPS est en panne ? Sors ton bon sens.",
      "C'est pas sale, c'est camouflé.",
      "Un bon soldat trouve ; un mauvais demande où c'est rangé.",
      "Le premier qui se plaint porte la radio.",
      "On part ensemble, on rentre ensemble.",
      "Range ton ego dans la poche latérale.",
      "Le mur est haut ? Prends de l'élan.",
      "Pas besoin d'être prêt, il faut être parti.",
      "Les excuses ne rentrent pas dans le sac.",
      "Sois précis : le flou est déjà occupé.",
      "Si tu hésites, choisis l'avant.",
      "La discipline fait ce que la motivation oublie.",
      "On respire après la ligne d'arrivée.",
      "Ta limite vient de reculer d'un kilomètre.",
      "Un coup de pompe ? Change de jambe.",
      "Le réveil n'est pas une proposition.",
      "En colonne, pas en troupeau.",
      "Camouflage parfait : personne ne t'a vu travailler.",
      "Le râtelier n'est pas un porte-manteau.",
      "Compte tes hommes avant tes histoires.",
      "Le briefing était clair pour ceux qui écoutaient.",
      "Matériel contrôlé, esprit tranquille.",
      "Une minute gagnée vaut mieux qu'une heure expliquée.",
      "Pas de héros isolé dans une section soudée.",
      "Fais face, même dans la boue.",
      "La nuit appartient à ceux qui ont vérifié leurs piles.",
      "Ton binôme est ton assurance-vie.",
      "Pas de petit effort, seulement des efforts utiles.",
      "La consigne est courte, la journée sera longue.",
      "La boue sèche, la fierté reste.",
      "Reçu cinq sur cinq, exécuté dix sur dix.",
      "Le hasard favorise les sections organisées.",
      "On ne recule pas, on prend de l'élan tactique.",
      "Rends compte, puis rends possible.",
      "Départ discret, arrivée remarquée.",
      "Ton grade n'allège pas ton sac.",
      "Reste souple sur les appuis et ferme sur la mission.",
      "Rompez… mais pas trop loin."
    ];

    const message = document.querySelector("#message");
    const results = document.querySelector("#results");
    const cards = document.querySelector("#cards");
    let previousDraw = [];

    function drawExpressions() {
      const available = expressions
        .map((text, index) => ({ text, index }))
        .filter(item => !previousDraw.includes(item.index));

      for (let i = available.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [available[i], available[j]] = [available[j], available[i]];
      }

      const draw = available.slice(0, 3);
      previousDraw = draw.map(item => item.index);
      cards.replaceChildren(...draw.map((item, index) => {
        const card = document.createElement("article");
        card.className = "card";
        const number = document.createElement("span");
        number.className = "number";
        number.textContent = String(index + 1).padStart(2, "0");
        const quote = document.createElement("p");
        quote.className = "quote";
        quote.textContent = `« ${item.text} »`;
        card.append(number, quote);
        return card;
      }));

      results.hidden = false;
      results.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    document.querySelector("#generate").addEventListener("click", drawExpressions);
    document.querySelector("#more").addEventListener("click", drawExpressions);
    document.querySelector("#restart").addEventListener("click", () => {
      message.value = "";
      previousDraw = [];
      results.hidden = true;
      cards.replaceChildren();
      message.focus();
    });
  </script>
</body>
</html>
